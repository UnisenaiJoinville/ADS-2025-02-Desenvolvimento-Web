<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produtos | Estoque Facil</title>
    <!-- CSS gerado pelo Tailwind CLI (Aula 69): npm run css:build -->
    <link rel="stylesheet" href="/css/app.css" />
    <!-- Icones (Aula 60). Versao fixa: o site nao muda sozinho amanha. -->
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <div data-nav></div>

    <main class="mx-auto max-w-7xl px-6 py-8">
      <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Produtos</h1>
          <p class="text-sm text-slate-500">Cadastro completo: criar, listar, editar e excluir</p>
        </div>
        <button
          data-new
          class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-700"
        >
          + Novo produto
        </button>
      </div>

      <!-- Filtros: aplicam sozinhos, sem botao "Filtrar" (Aula 64) -->
      <section class="mb-4 rounded-2xl border border-slate-200 bg-white p-4">
        <form data-filters class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
          <div class="relative lg:col-span-2">
            <label for="filter-search" class="sr-only">Buscar produto</label>
            <i
              data-lucide="search"
              class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"
            ></i>
            <input
              id="filter-search"
              name="search"
              type="search"
              autocomplete="off"
              placeholder="Buscar por nome ou SKU"
              class="w-full rounded-xl border border-slate-300 py-2 pl-9 pr-3 text-sm outline-none focus:border-slate-900"
            />
          </div>

          <div>
            <label for="filter-category" class="sr-only">Categoria</label>
            <select
              id="filter-category"
              name="categoryId"
              class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900"
            >
              <option value="">Todas as categorias</option>
            </select>
          </div>

          <div class="flex items-center justify-between gap-2">
            <label class="flex items-center gap-2 px-1 text-sm text-slate-600">
              <input name="lowStock" type="checkbox" class="h-4 w-4 rounded border-slate-300" />
              Apenas estoque baixo
            </label>
            <button
              type="reset"
              class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50"
            >
              Limpar
            </button>
          </div>
        </form>
      </section>

      <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="border-b border-slate-200 bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
              <tr>
                <th class="px-4 py-3">Produto</th>
                <th class="px-4 py-3">Categoria</th>
                <th class="px-4 py-3 text-right">Custo</th>
                <th class="px-4 py-3 text-right">Venda</th>
                <th class="px-4 py-3 text-right">Estoque</th>
                <th class="px-4 py-3 text-center">Status</th>
                <th class="px-4 py-3 text-right">Acoes</th>
              </tr>
            </thead>
            <tbody data-rows class="divide-y divide-slate-100"></tbody>
          </table>
        </div>

        <!-- Rodape de paginacao (Aula 64) -->
        <div class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-200 px-4 py-3 text-sm">
          <p data-page-info class="text-slate-500" aria-live="polite"></p>

          <div class="flex items-center gap-2">
            <label for="page-size" class="text-slate-500">Por pagina</label>
            <select
              id="page-size"
              data-page-size
              class="rounded-lg border border-slate-300 px-2 py-1 text-sm outline-none focus:border-slate-900"
            >
              <option value="10" selected>10</option>
              <option value="25">25</option>
              <option value="50">50</option>
            </select>

            <button
              type="button"
              data-page-prev
              aria-label="Pagina anterior"
              title="Pagina anterior"
              class="grid h-8 w-8 place-items-center rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40"
            >
              <i data-lucide="chevron-left" class="h-4 w-4"></i>
            </button>
            <span data-page-label class="min-w-[4rem] text-center font-medium text-slate-700"></span>
            <button
              type="button"
              data-page-next
              aria-label="Proxima pagina"
              title="Proxima pagina"
              class="grid h-8 w-8 place-items-center rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40"
            >
              <i data-lucide="chevron-right" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- Modal de cadastro / edicao (acessivel desde a Aula 66) -->
    <div data-modal class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-900/50 p-4">
      <div
        role="dialog"
        aria-modal="true"
        aria-labelledby="product-modal-title"
        class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-6"
      >
        <div class="mb-4 flex items-start justify-between">
          <h2 id="product-modal-title" data-modal-title class="text-lg font-semibold text-slate-900">
            Novo produto
          </h2>
          <button
            type="button"
            data-close
            aria-label="Fechar"
            title="Fechar"
            class="grid h-8 w-8 place-items-center rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-700"
          >
            <i data-lucide="x" class="h-5 w-5"></i>
          </button>
        </div>

        <form data-form class="space-y-4">
          <input type="hidden" name="id" />

          <div>
            <label for="product-name" class="mb-1 block text-sm font-medium text-slate-700">Nome</label>
            <input
              id="product-name"
              name="name"
              required
              maxlength="120"
              class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900"
            />
          </div>

          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="product-sku" class="mb-1 block text-sm font-medium text-slate-700">SKU</label>
              <input
                id="product-sku"
                name="sku"
                required
                maxlength="40"
                placeholder="BEB-001"
                class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm uppercase outline-none focus:border-slate-900"
              />
            </div>
            <div>
              <label for="product-category" class="mb-1 block text-sm font-medium text-slate-700">Categoria</label>
              <select
                id="product-category"
                name="categoryId"
                class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900"
              >
                <option value="">Sem categoria</option>
              </select>
            </div>
          </div>

          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="product-cost" class="mb-1 block text-sm font-medium text-slate-700">Preco de custo</label>
              <input
                id="product-cost"
                name="costPrice"
                type="number"
                step="0.01"
                min="0"
                value="0"
                required
                inputmode="decimal"
                class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900"
              />
            </div>
            <div>
              <label for="product-sale" class="mb-1 block text-sm font-medium text-slate-700">Preco de venda</label>
              <input
                id="product-sale"
                name="salePrice"
                type="number"
                step="0.01"
                min="0"
                value="0"
                required
                inputmode="decimal"
                class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900"
              />
            </div>
          </div>

          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="product-quantity" class="mb-1 block text-sm font-medium text-slate-700">Quantidade inicial</label>
              <input
                id="product-quantity"
                name="quantity"
                type="number"
                min="0"
                value="0"
                required
                inputmode="numeric"
                class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900"
              />
            </div>
            <div>
              <label for="product-minimum" class="mb-1 block text-sm font-medium text-slate-700">Estoque minimo</label>
              <input
                id="product-minimum"
                name="minimumStock"
                type="number"
                min="0"
                value="0"
                required
                inputmode="numeric"
                class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900"
              />
            </div>
          </div>

          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input name="active" type="checkbox" checked class="h-4 w-4 rounded border-slate-300" />
            Produto ativo
          </label>

          <div class="flex justify-end gap-2 pt-2">
            <button
              type="button"
              data-close
              class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50"
            >
              Cancelar
            </button>
            <button
              type="submit"
              data-save
              class="rounded-xl bg-slate-900 px-5 py-2 text-sm font-semibold text-white hover:bg-slate-700 disabled:cursor-not-allowed disabled:bg-slate-300"
            >
              Salvar
            </button>
          </div>
        </form>
      </div>
    </div>

    <div data-toast-stack class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

    <script type="module" src="/js/produtos.js"></script>
  </body>
</html>
