<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard | Estoque Facil</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-100 text-slate-900"><div data-nav></div><main class="mx-auto max-w-7xl px-6 py-8"><div class="mb-6 flex flex-wrap items-end justify-between gap-4"><div><h1 class="text-2xl font-bold">Dashboard</h1><p class="text-sm text-slate-500">Visao geral do estoque em tempo real</p></div><button data-reload class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">Atualizar</button></div><section data-cards class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4"></section><section data-month class="mt-4 grid gap-4 sm:grid-cols-3"></section><div class="mt-8 grid gap-6 lg:grid-cols-2"><section class="rounded-2xl border bg-white p-6"><h2 class="text-lg font-semibold">Estoque por categoria</h2><div data-by-category class="mt-4 space-y-4"></div></section><section class="rounded-2xl border bg-white p-6"><h2 class="text-lg font-semibold">Estoque baixo</h2><div data-low-stock class="mt-4 space-y-2"></div></section></div><section class="mt-6 rounded-2xl border bg-white p-6"><h2 class="text-lg font-semibold">Ultimas movimentacoes</h2><div class="mt-4 overflow-x-auto"><table class="w-full text-left text-sm"><thead class="border-b text-xs uppercase text-slate-500"><tr><th class="pb-2">Produto</th><th class="pb-2">Tipo</th><th class="pb-2 text-right">Qtd.</th><th class="pb-2 text-right">Data</th></tr></thead><tbody data-recent class="divide-y"></tbody></table></div></section></main><div data-toast-stack class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div><script type="module" src="/js/dashboard.js"></script></body></html>
