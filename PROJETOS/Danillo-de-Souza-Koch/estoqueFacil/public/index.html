<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Estoque Facil</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <div data-nav></div>
    <main class="mx-auto max-w-7xl px-6 py-8">
      <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold">Dashboard</h1>
          <p class="text-sm text-slate-500">Visao geral do estoque em tempo real</p>
        </div>
        <button data-reload type="button" class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">Atualizar</button>
      </div>
      <section data-cards class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4"></section>
      <section data-month class="mt-4 grid gap-4 sm:grid-cols-3"></section>

      <section class="mt-6 rounded-2xl border bg-white p-6">
        <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
          <div>
            <h2 class="text-lg font-semibold">Entradas x saidas por dia</h2>
            <p class="text-sm text-slate-500">Unidades movimentadas em cada dia do periodo</p>
          </div>
          <div class="flex gap-1 rounded-xl bg-slate-100 p-1" role="group" aria-label="Periodo do grafico">
            <button type="button" data-days="7" aria-pressed="false" class="rounded-lg px-3 py-1.5 text-xs font-semibold">7 dias</button>
            <button type="button" data-days="30" aria-pressed="true" class="rounded-lg px-3 py-1.5 text-xs font-semibold">30 dias</button>
            <button type="button" data-days="90" aria-pressed="false" class="rounded-lg px-3 py-1.5 text-xs font-semibold">90 dias</button>
          </div>
        </div>
        <p data-chart-error class="hidden mb-3 text-sm text-rose-600" role="status"></p>
        <div class="relative h-72">
          <canvas data-chart role="img" aria-label="Grafico de barras com as entradas e as saidas de cada dia"></canvas>
        </div>
        <p data-chart-summary class="sr-only" aria-live="polite"></p>
      </section>

      <div class="mt-8 grid gap-6 lg:grid-cols-2">
        <section class="rounded-2xl border bg-white p-6">
          <h2 class="text-lg font-semibold">Estoque por categoria</h2>
          <div data-by-category class="mt-4 space-y-4"></div>
        </section>
        <section class="rounded-2xl border bg-white p-6">
          <h2 class="text-lg font-semibold">Estoque baixo</h2>
          <div data-low-stock class="mt-4 space-y-2"></div>
        </section>
      </div>
      <section class="mt-6 rounded-2xl border bg-white p-6">
        <h2 class="text-lg font-semibold">Ultimas movimentacoes</h2>
        <div class="mt-4 overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="border-b text-xs uppercase text-slate-500">
              <tr><th class="pb-2">Produto</th><th class="pb-2">Tipo</th><th class="pb-2 text-right">Qtd.</th><th class="pb-2 text-right">Data</th></tr>
            </thead>
            <tbody data-recent class="divide-y"></tbody>
          </table>
        </div>
      </section>
    </main>
    <div data-toast-stack class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>
    <script type="module" src="/js/dashboard.js"></script>
  </body>
</html>
