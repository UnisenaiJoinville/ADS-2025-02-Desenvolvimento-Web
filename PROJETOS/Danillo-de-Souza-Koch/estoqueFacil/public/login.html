<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Estoque Facil</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      [v-cloak] { display: none; }
    </style>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main id="app" v-cloak class="grid min-h-screen place-items-center px-6 py-10">
      <div class="w-full max-w-md">
        <header class="mb-8 flex flex-col items-center gap-3">
          <div class="grid h-14 w-14 place-items-center rounded-2xl bg-slate-900 text-xl font-bold text-white">EF</div>
          <div class="text-center">
            <h1 class="text-2xl font-bold">Estoque Facil</h1>
            <p class="text-sm text-slate-500">Entre para gerenciar seu estoque</p>
          </div>
        </header>

        <form class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm" @submit.prevent="handleSubmit">
          <p v-if="successMessage" class="mb-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">{{ successMessage }}</p>
          <p v-if="errorMessage" class="mb-4 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">{{ errorMessage }}</p>

          <label class="block">
            <span class="text-sm font-medium text-slate-700">E-mail</span>
            <input v-model.trim="form.email" type="email" autocomplete="email" placeholder="voce@empresa.com" class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-slate-900" />
          </label>

          <label class="mt-4 block">
            <span class="text-sm font-medium text-slate-700">Senha</span>
            <div class="relative mt-1">
              <input v-model="form.password" :type="showPassword ? 'text' : 'password'" autocomplete="current-password" placeholder="Sua senha" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 pr-12 text-sm outline-none focus:border-slate-900" @keydown="checkCapsLock" @keyup="checkCapsLock" @blur="capsLockOn = false" />
              <button type="button" class="absolute inset-y-0 right-0 grid w-12 place-items-center rounded-r-xl text-slate-400 transition hover:text-slate-900 focus-visible:text-slate-900" :aria-label="showPassword ? 'Ocultar senha' : 'Mostrar senha'" :title="showPassword ? 'Ocultar senha' : 'Mostrar senha'" :aria-pressed="showPassword" @click="showPassword = !showPassword">
                <span v-show="showPassword"><i data-lucide="eye-off" class="h-5 w-5"></i></span>
                <span v-show="!showPassword"><i data-lucide="eye" class="h-5 w-5"></i></span>
              </button>
            </div>
            <span v-show="capsLockOn" class="mt-1 flex items-center gap-1 text-xs font-medium text-amber-700">
              <span><i data-lucide="triangle-alert" class="h-3.5 w-3.5"></i></span>
              Caps Lock ativado
            </span>
          </label>

          <button type="submit" :disabled="!canSubmit" class="mt-6 w-full rounded-xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white disabled:cursor-not-allowed disabled:bg-slate-300">{{ loading ? "Entrando..." : "Entrar" }}</button>

          <p class="mt-6 text-center text-sm text-slate-500">
            Ainda nao tem conta? <a href="/cadastro.html" class="font-semibold text-slate-900 hover:underline">Criar conta</a>
          </p>
        </form>

        <div class="mt-4 rounded-2xl border border-dashed border-slate-300 bg-white/60 p-4 text-center">
          <p class="text-xs text-slate-500">Conta de demonstracao: <strong>professor@estoquefacil.com</strong> / <strong>123456</strong></p>
          <button type="button" class="mt-2 text-xs font-semibold text-slate-900 hover:underline" @click="fillDemo">Preencher automaticamente</button>
        </div>
      </div>
    </main>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
