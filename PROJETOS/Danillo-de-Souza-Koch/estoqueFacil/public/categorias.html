<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Categorias | Estoque Facil</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-100 text-slate-900"><div data-nav></div><main class="mx-auto max-w-3xl px-6 py-8"><h1 class="text-2xl font-bold">Categorias</h1><p class="mb-6 text-sm text-slate-500">Organize os produtos por grupo</p><section class="mb-6 rounded-2xl border bg-white p-6"><form data-form class="flex flex-wrap items-end gap-3"><input type="hidden" name="id"><input name="name" required placeholder="Nome da categoria" class="min-w-[220px] flex-1 rounded-xl border px-3 py-2 text-sm"><button class="rounded-xl bg-slate-900 px-5 py-2 text-sm font-semibold text-white">Salvar</button><button type="button" data-cancel class="hidden rounded-xl border px-4 py-2 text-sm">Cancelar</button></form></section><section class="overflow-hidden rounded-2xl border bg-white"><table class="w-full text-left text-sm"><thead class="border-b bg-slate-50 text-xs uppercase text-slate-500"><tr><th class="px-6 py-3">Categoria</th><th class="px-4 py-3 text-right">Produtos</th><th class="px-6 py-3 text-right">Acoes</th></tr></thead><tbody data-rows class="divide-y"></tbody></table></section></main><div data-toast-stack class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div><script type="module" src="/js/categorias.js"></script></body></html>
