<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produtos | Estoque Facil</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <div data-nav></div>
    <main class="mx-auto max-w-7xl px-6 py-8">
      <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold">Produtos</h1>
          <p class="text-sm text-slate-500">Cadastro, filtros e estoque</p>
        </div>
        <button data-new type="button" class="inline-flex items-center gap-2 rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">
          <i data-lucide="plus" class="h-4 w-4"></i>Novo produto
        </button>
      </div>

      <section class="mb-4 rounded-2xl border bg-white p-4">
        <form data-filters class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
          <div class="relative lg:col-span-2">
            <label for="filter-search" class="sr-only">Buscar produto</label>
            <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
            <input id="filter-search" name="search" type="search" autocomplete="off" placeholder="Buscar por nome ou SKU" class="w-full rounded-xl border px-3 py-2 pl-9 text-sm">
          </div>
          <div>
            <label for="filter-category" class="sr-only">Categoria</label>
            <select id="filter-category" name="categoryId" class="w-full rounded-xl border px-3 py-2 text-sm">
              <option value="">Todas as categorias</option>
            </select>
          </div>
          <div class="flex items-center justify-between gap-2">
            <label class="flex items-center gap-2 px-1 text-sm text-slate-600">
              <input name="lowStock" type="checkbox" class="h-4 w-4 rounded border-slate-300">
              Apenas estoque baixo
            </label>
            <button type="reset" class="rounded-xl border px-4 py-2 text-sm">Limpar</button>
          </div>
        </form>
      </section>

      <section class="overflow-hidden rounded-2xl border bg-white">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="border-b bg-slate-50 text-xs uppercase text-slate-500">
              <tr>
                <th class="px-4 py-3">Produto</th>
                <th class="px-4 py-3">Categoria</th>
                <th class="px-4 py-3 text-right">Custo</th>
                <th class="px-4 py-3 text-right">Venda</th>
                <th class="px-4 py-3 text-right">Estoque</th>
                <th class="px-4 py-3 text-center">Status</th>
                <th class="px-4 py-3 text-right">Acoes</th>
              </tr>
            </thead>
            <tbody data-rows class="divide-y" aria-live="polite"></tbody>
          </table>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-3 border-t px-4 py-3 text-sm">
          <p data-page-info class="text-slate-500" aria-live="polite"></p>
          <div class="flex items-center gap-2">
            <label for="page-size" class="text-slate-500">Por pagina</label>
            <select id="page-size" data-page-size class="rounded-lg border px-2 py-1 text-sm">
              <option value="10" selected>10</option>
              <option value="25">25</option>
              <option value="50">50</option>
            </select>
            <button type="button" data-page-prev aria-label="Pagina anterior" title="Pagina anterior" class="grid h-8 w-8 place-items-center rounded-lg border disabled:opacity-40">
              <i data-lucide="chevron-left" class="h-4 w-4"></i>
            </button>
            <span data-page-label class="min-w-[4rem] text-center font-medium"></span>
            <button type="button" data-page-next aria-label="Proxima pagina" title="Proxima pagina" class="grid h-8 w-8 place-items-center rounded-lg border disabled:opacity-40">
              <i data-lucide="chevron-right" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </section>
    </main>

    <div data-modal class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-900/50 p-4">
      <div role="dialog" aria-modal="true" aria-labelledby="product-modal-title" class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-6">
        <div class="mb-4 flex justify-between">
          <h2 id="product-modal-title" data-modal-title class="text-lg font-semibold">Novo produto</h2>
          <button type="button" data-close aria-label="Fechar" class="rounded p-1 text-slate-500"><i data-lucide="x" class="h-5 w-5"></i></button>
        </div>
        <form data-form class="space-y-4">
          <input type="hidden" name="id">
          <label class="block text-sm font-medium">Nome
            <input data-product-name name="name" required class="mt-1 w-full rounded-xl border px-3 py-2 text-sm">
          </label>
          <div class="grid gap-4 sm:grid-cols-2">
            <label class="block text-sm font-medium">SKU
              <input name="sku" required class="mt-1 w-full rounded-xl border px-3 py-2 text-sm">
            </label>
            <label class="block text-sm font-medium">Categoria
              <select name="categoryId" class="mt-1 w-full rounded-xl border px-3 py-2 text-sm">
                <option value="">Sem categoria</option>
              </select>
            </label>
          </div>
          <div class="grid gap-4 sm:grid-cols-2">
            <label class="block text-sm font-medium">Preco de custo
              <input name="costPrice" type="number" step="0.01" min="0" value="0" class="mt-1 w-full rounded-xl border px-3 py-2 text-sm">
            </label>
            <label class="block text-sm font-medium">Preco de venda
              <input name="salePrice" type="number" step="0.01" min="0" value="0" class="mt-1 w-full rounded-xl border px-3 py-2 text-sm">
            </label>
          </div>
          <div class="grid gap-4 sm:grid-cols-2">
            <label class="block text-sm font-medium">Quantidade
              <input name="quantity" type="number" min="0" value="0" class="mt-1 w-full rounded-xl border px-3 py-2 text-sm">
            </label>
            <label class="block text-sm font-medium">Estoque minimo
              <input name="minimumStock" type="number" min="0" value="0" class="mt-1 w-full rounded-xl border px-3 py-2 text-sm">
            </label>
          </div>
          <label class="flex items-center gap-2 text-sm"><input name="active" type="checkbox" checked> Produto ativo</label>
          <div class="flex justify-end gap-2">
            <button type="button" data-close class="rounded-xl border px-4 py-2 text-sm">Cancelar</button>
            <button data-save type="submit" class="rounded-xl bg-slate-900 px-5 py-2 text-sm font-semibold text-white">Salvar</button>
          </div>
        </form>
      </div>
    </div>
    <div data-toast-stack class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>
    <script type="module" src="/js/produtos.js"></script>
  </body>
</html>
