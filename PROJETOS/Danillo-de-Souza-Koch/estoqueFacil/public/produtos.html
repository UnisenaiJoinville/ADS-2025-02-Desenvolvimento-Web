<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Produtos | Estoque Facil</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-100 text-slate-900"><div data-nav></div><main class="mx-auto max-w-7xl px-6 py-8"><div class="mb-6 flex flex-wrap items-end justify-between gap-4"><div><h1 class="text-2xl font-bold">Produtos</h1><p class="text-sm text-slate-500">Cadastro, filtros e estoque</p></div><button data-new class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">+ Novo produto</button></div><section class="mb-4 rounded-2xl border bg-white p-4"><form data-filters class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4"><input name="search" placeholder="Buscar nome ou SKU" class="rounded-xl border px-3 py-2 text-sm"><select name="categoryId" class="rounded-xl border px-3 py-2 text-sm"><option value="">Todas as categorias</option></select><label class="flex items-center gap-2 text-sm"><input name="lowStock" type="checkbox"> Apenas estoque baixo</label><div class="flex gap-2"><button class="flex-1 rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">Filtrar</button><button type="reset" class="rounded-xl border px-4 py-2 text-sm">Limpar</button></div></form></section><section class="overflow-hidden rounded-2xl border bg-white"><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="border-b bg-slate-50 text-xs uppercase text-slate-500"><tr><th class="px-4 py-3">Produto</th><th class="px-4 py-3">Categoria</th><th class="px-4 py-3 text-right">Custo</th><th class="px-4 py-3 text-right">Venda</th><th class="px-4 py-3 text-right">Estoque</th><th class="px-4 py-3 text-center">Status</th><th class="px-4 py-3 text-right">Acoes</th></tr></thead><tbody data-rows class="divide-y"></tbody></table></div></section></main><div data-modal class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-900/50 p-4"><div class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-6"><div class="mb-4 flex justify-between"><h2 data-modal-title class="text-lg font-semibold">Novo produto</h2><button data-close class="text-2xl">&times;</button></div><form data-form class="space-y-4"><input type="hidden" name="id"><input name="name" required placeholder="Nome" class="w-full rounded-xl border px-3 py-2 text-sm"><div class="grid gap-4 sm:grid-cols-2"><input name="sku" required placeholder="SKU" class="rounded-xl border px-3 py-2 text-sm"><select name="categoryId" class="rounded-xl border px-3 py-2 text-sm"><option value="">Sem categoria</option></select></div><div class="grid gap-4 sm:grid-cols-2"><input name="costPrice" type="number" step="0.01" min="0" value="0" class="rounded-xl border px-3 py-2 text-sm"><input name="salePrice" type="number" step="0.01" min="0" value="0" class="rounded-xl border px-3 py-2 text-sm"></div><div class="grid gap-4 sm:grid-cols-2"><input name="quantity" type="number" min="0" value="0" class="rounded-xl border px-3 py-2 text-sm"><input name="minimumStock" type="number" min="0" value="0" class="rounded-xl border px-3 py-2 text-sm"></div><label class="flex items-center gap-2 text-sm"><input name="active" type="checkbox" checked> Produto ativo</label><div class="flex justify-end gap-2"><button type="button" data-close class="rounded-xl border px-4 py-2 text-sm">Cancelar</button><button class="rounded-xl bg-slate-900 px-5 py-2 text-sm font-semibold text-white">Salvar</button></div></form></div></div><div data-toast-stack class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div><script type="module" src="/js/produtos.js"></script></body></html>
