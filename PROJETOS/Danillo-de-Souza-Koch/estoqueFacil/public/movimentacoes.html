<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movimentacoes | Estoque Facil</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <div data-nav></div>
    <main class="mx-auto max-w-7xl px-6 py-8">
      <h1 class="text-2xl font-bold">Movimentacoes</h1>
      <p class="mb-6 text-sm text-slate-500">Cada entrada soma e cada saida subtrai o estoque</p>
      <div class="grid gap-6 lg:grid-cols-3">
        <section class="rounded-2xl border bg-white p-6">
          <h2 class="mb-4 text-lg font-semibold">Registrar movimentacao</h2>
          <form data-form class="space-y-4">
            <div data-product-combobox class="relative">
              <label for="product-search" class="block text-sm font-medium">Produto</label>
              <input id="product-search" data-product-search role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="product-suggestions" autocomplete="off" maxlength="60" placeholder="Buscar por nome ou SKU" class="mt-1 w-full rounded-xl border px-3 py-2 text-sm">
              <input type="hidden" name="productId">
              <ul id="product-suggestions" data-product-suggestions role="listbox" class="absolute z-20 mt-1 hidden max-h-64 w-full overflow-y-auto rounded-xl border bg-white shadow-lg"></ul>
              <p data-stock-hint class="mt-2 text-xs text-slate-500" aria-live="polite"></p>
            </div>
            <fieldset>
              <legend class="mb-2 text-sm font-medium">Tipo de movimentacao</legend>
              <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center gap-2"><input type="radio" name="type" value="IN" checked> Entrada</label>
                <label class="flex items-center gap-2"><input type="radio" name="type" value="OUT"> Saida</label>
              </div>
            </fieldset>
            <label for="movement-quantity" class="block text-sm font-medium">Quantidade</label>
            <input id="movement-quantity" name="quantity" type="number" min="1" value="1" required class="w-full rounded-xl border px-3 py-2 text-sm">
            <label for="movement-note" class="block text-sm font-medium">Observacao</label>
            <input id="movement-note" name="note" placeholder="Observacao" class="w-full rounded-xl border px-3 py-2 text-sm">
            <button data-submit type="submit" class="w-full rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white">Registrar</button>
          </form>
        </section>

        <section class="rounded-2xl border bg-white lg:col-span-2">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b p-6">
            <h2 class="text-lg font-semibold">Historico</h2>
            <div class="flex gap-1">
              <button type="button" data-filter="" aria-pressed="true" class="rounded-lg bg-slate-900 px-3 py-1.5 text-xs text-white">Todas</button>
              <button type="button" data-filter="IN" aria-pressed="false" class="rounded-lg border px-3 py-1.5 text-xs">Entradas</button>
              <button type="button" data-filter="OUT" aria-pressed="false" class="rounded-lg border px-3 py-1.5 text-xs">Saidas</button>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="border-b bg-slate-50 text-xs uppercase text-slate-500">
                <tr><th class="px-6 py-3">Produto</th><th class="px-4 py-3">Tipo</th><th class="px-4 py-3 text-right">Qtd.</th><th class="px-4 py-3">Observacao</th><th class="px-6 py-3 text-right">Data</th></tr>
              </thead>
              <tbody data-rows class="divide-y" aria-live="polite"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
    <div data-toast-stack class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>
    <script type="module" src="/js/movimentacoes.js"></script>
  </body>
</html>
