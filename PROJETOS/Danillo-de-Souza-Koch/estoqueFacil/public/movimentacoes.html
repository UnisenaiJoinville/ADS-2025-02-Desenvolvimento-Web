<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Movimentacoes | Estoque Facil</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-100 text-slate-900"><div data-nav></div><main class="mx-auto max-w-7xl px-6 py-8"><h1 class="text-2xl font-bold">Movimentacoes</h1><p class="mb-6 text-sm text-slate-500">Cada entrada soma e cada saida subtrai o estoque</p><div class="grid gap-6 lg:grid-cols-3"><section class="rounded-2xl border bg-white p-6"><h2 class="mb-4 text-lg font-semibold">Registrar movimentacao</h2><form data-form class="space-y-4"><select name="productId" required class="w-full rounded-xl border px-3 py-2 text-sm"><option value="">Selecione...</option></select><p data-stock-hint class="text-xs text-slate-500"></p><div class="grid grid-cols-2 gap-2"><label><input type="radio" name="type" value="IN" checked> Entrada</label><label><input type="radio" name="type" value="OUT"> Saida</label></div><input name="quantity" type="number" min="1" value="1" required class="w-full rounded-xl border px-3 py-2 text-sm"><input name="note" placeholder="Observacao" class="w-full rounded-xl border px-3 py-2 text-sm"><button class="w-full rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white">Registrar</button></form></section><section class="rounded-2xl border bg-white lg:col-span-2"><div class="flex flex-wrap items-center justify-between gap-3 border-b p-6"><h2 class="text-lg font-semibold">Historico</h2><div class="flex gap-1"><button data-filter="" class="rounded-lg bg-slate-900 px-3 py-1.5 text-xs text-white">Todas</button><button data-filter="IN" class="rounded-lg border px-3 py-1.5 text-xs">Entradas</button><button data-filter="OUT" class="rounded-lg border px-3 py-1.5 text-xs">Saidas</button></div></div><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="border-b bg-slate-50 text-xs uppercase text-slate-500"><tr><th class="px-6 py-3">Produto</th><th class="px-4 py-3">Tipo</th><th class="px-4 py-3 text-right">Qtd.</th><th class="px-4 py-3">Observacao</th><th class="px-6 py-3 text-right">Data</th></tr></thead><tbody data-rows class="divide-y"></tbody></table></div></section></div></main><div data-toast-stack class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div><script type="module" src="/js/movimentacoes.js"></script></body></html>
