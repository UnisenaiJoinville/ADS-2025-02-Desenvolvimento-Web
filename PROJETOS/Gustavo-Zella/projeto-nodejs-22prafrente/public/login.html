<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Estoque Facil</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="grid min-h-screen place-items-center bg-slate-100 px-4 text-slate-900">
    <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-8">
      <div class="mb-6 flex flex-col items-center gap-2 text-center">
        <div class="grid h-12 w-12 place-items-center rounded-xl bg-slate-900 text-xl font-bold text-white">EF</div>
        <h1 class="text-lg font-semibold text-slate-900">Estoque Facil</h1>
        <p class="text-sm text-slate-500">Entre para gerenciar o estoque</p>
      </div>

      <form data-form class="space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">E-mail</label>
          <input
            name="email"
            type="email"
            required
            value="admin@estoquefacil.com"
            class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900"
          />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Senha</label>
          <input
            name="password"
            type="password"
            required
            value="admin123"
            class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900"
          />
        </div>

        <p data-error class="hidden rounded-xl bg-rose-50 px-3 py-2 text-sm text-rose-600"></p>

        <button class="w-full rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white hover:bg-slate-700">
          Entrar
        </button>
      </form>

      <p class="mt-4 text-center text-xs text-slate-400">
        Usuario de exemplo: admin@estoquefacil.com / admin123
      </p>

      <p class="mt-4 text-center text-sm text-slate-500">
        <a href="/index.html" class="font-medium text-slate-700 hover:underline">
          Continuar sem entrar (apenas leitura)
        </a>
      </p>
    </div>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
