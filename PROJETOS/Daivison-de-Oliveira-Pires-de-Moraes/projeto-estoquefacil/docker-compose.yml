services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Rode npm run setup primeiro}
      MYSQL_DATABASE: ${DB_NAME:-estoque_db}
      MYSQL_USER: ${DB_USER:-estoque}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Rode npm run setup primeiro}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3308}:3306"
    volumes:
      - estoque-db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-time-zone=-03:00",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  api:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      PORT: 3000
      TRUST_PROXY: "false"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  estoque-db-data:
