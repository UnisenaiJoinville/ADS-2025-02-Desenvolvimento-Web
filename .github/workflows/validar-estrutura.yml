name: Validar envio em branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validar subpasta de aluno
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar branch base
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Validar envio na subpasta existente
        shell: bash
        run: |
          set -e

          git config core.quotepath off

          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)

          if [ -z "$CHANGED" ]; then
            echo "Nenhum arquivo alterado neste PR."
            exit 0
          fi

          echo "## Arquivos alterados neste PR" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$CHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          MATERIAS="BANCO-DE-DADOS NODEJS DOCKER PROJETO-INDIVIDUAL"

          FAIL=0
          SUBPASTA_REF=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            materia=$(echo "$file" | cut -d/ -f1)
            subpasta=$(echo "$file" | cut -d/ -f2)
            profundidade=$(echo "$file" | awk -F/ '{print NF}')

            match=0
            for m in $MATERIAS; do
              [ "$materia" = "$m" ] && match=1
            done

            if [ "$match" -eq 0 ]; then
              echo "::error file=$file::Arquivo fora das pastas permitidas ($MATERIAS)."
              FAIL=1
              continue
            fi

            if [ -z "$subpasta" ] || [ "$profundidade" -lt 3 ]; then
              echo "::error file=$file::Não é permitido alterar arquivos direto em '$materia/' ou criar pasta nova na raiz da matéria. Use uma subpasta de aluno já existente na main."
              FAIL=1
              continue
            fi

            if ! git cat-file -e "$BASE:$materia/$subpasta" 2>/dev/null; then
              echo "::error file=$file::A subpasta '$materia/$subpasta' precisa existir na branch main antes do envio. Não crie uma nova subpasta de aluno no PR."
              FAIL=1
              continue
            fi

            if [ -z "$SUBPASTA_REF" ]; then
              SUBPASTA_REF="$materia/$subpasta"
            elif [ "$materia/$subpasta" != "$SUBPASTA_REF" ]; then
              echo "::error file=$file::Este Pull Request altera mais de uma subpasta de aluno ('$SUBPASTA_REF' e '$materia/$subpasta'). Cada PR deve conter só uma subpasta existente."
              FAIL=1
            fi
          done <<< "$CHANGED"

          if [ "$FAIL" -eq 1 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **Este Pull Request não segue a estrutura esperada.** Veja os erros acima, ajuste e envie novamente." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **Estrutura válida.** Alterações restritas à subpasta existente: \`$SUBPASTA_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Estrutura válida! Alterações restritas à subpasta existente: $SUBPASTA_REF"
