name: Validar envio em branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validar envio do aluno
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar branch base
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Validar envio na subpasta do aluno
        shell: bash
        run: |
          set -e

          git config core.quotepath off

          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)

          if [ -z "$CHANGED" ]; then
            echo "Nenhum arquivo alterado neste PR."
            exit 0
          fi

          echo "## Arquivos alterados neste PR" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$CHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          MATERIAS="BANCO-DE-DADOS NODEJS DOCKER PROJETO-INDIVIDUAL"

          FAIL=0
          SUBPASTA_REF=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            materia=$(echo "$file" | cut -d/ -f1)
            subpasta=$(echo "$file" | cut -d/ -f2)
            profundidade=$(echo "$file" | awk -F/ '{print NF}')

            match=0
            for m in $MATERIAS; do
              [ "$materia" = "$m" ] && match=1
            done

            if [ "$match" -eq 0 ]; then
              echo "::error file=$file::Envio inválido: use uma das pastas permitidas ($MATERIAS)."
              FAIL=1
              continue
            fi

            if [ -z "$subpasta" ] || [ "$profundidade" -lt 3 ]; then
              echo "::error file=$file::Envio inválido: não altere arquivos direto em '$materia/' e não crie nova pasta de aluno na raiz da matéria. Use uma subpasta que já exista na main."
              FAIL=1
              continue
            fi

            if ! git cat-file -e "$BASE:$materia/$subpasta" 2>/dev/null; then
              echo "::error file=$file::Envio inválido: a subpasta '$materia/$subpasta' precisa existir na branch main antes do PR."
              FAIL=1
              continue
            fi

            if [ -z "$SUBPASTA_REF" ]; then
              SUBPASTA_REF="$materia/$subpasta"
            elif [ "$materia/$subpasta" != "$SUBPASTA_REF" ]; then
              echo "::error file=$file::Envio inválido: este PR altera mais de uma subpasta de aluno ('$SUBPASTA_REF' e '$materia/$subpasta'). Use apenas uma subpasta existente por PR."
              FAIL=1
            fi
          done <<< "$CHANGED"

          if [ "$FAIL" -eq 1 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **Envio recusado.** Use uma única subpasta de aluno que já exista na main. Veja os erros acima, corrija e envie de novo." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **Envio válido.** Alterações restritas à subpasta do aluno: \`$SUBPASTA_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Envio válido! Alterações restritas à subpasta do aluno: $SUBPASTA_REF"
