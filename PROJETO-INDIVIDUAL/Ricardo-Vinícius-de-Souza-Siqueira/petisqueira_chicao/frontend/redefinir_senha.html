<div class="container-login">
    <div class="login-box">

        <small>Início • Minha Conta • Nova senha</small>

        <h3 class="mt-3 mb-3">Criar nova senha</h3>

        <form id="frmRedefinir" onsubmit="return redefinir(event)">
            <div class="form-group">
                <label for="nova-senha">Nova senha</label>
                <input type="password" class="form-control" id="nova-senha" placeholder="Mínimo de 8 caracteres" minlength="8" maxlength="72" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label for="nova-senha2">Confirmar nova senha</label>
                <input type="password" class="form-control" id="nova-senha2" placeholder="Repita a senha" minlength="8" maxlength="72" autocomplete="new-password" required>
            </div>

            <button class="login-botton" type="submit" id="btn-redefinir">Salvar nova senha</button>

            <div class="text-center mt-3" style="font-size:14px;">

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=4"></script>
<script>
// O token vem no link do e-mail: redefinir_senha.html?token=...
const token = new URLSearchParams(window.location.search).get("token") || "";

if (!token) {
    document.getElementById("frmRedefinir").innerHTML =
        '<p>Link inválido. <a href="esqueci_senha.html">Peça um novo link de recuperação</a>.</p>';
}

async function redefinir(event) {
    event.preventDefault();

    const senha = document.getElementById("nova-senha").value;
    if (senha !== document.getElementById("nova-senha2").value) {
        alert("As senhas não coincidem.");
        return false;
    }

    const botao = document.getElementById("btn-redefinir");
    const textoOriginal = botao.textContent;
    botao.disabled = true;
    botao.textContent = "Salvando...";

    try {
        const resposta = await fetch(`${API_URL}/auth/redefinir_senha.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, senha })
        });
        const dados = await resposta.json();

        if (!resposta.ok) {
            alert(dados.erro || "Não foi possível redefinir a senha.");
            return false;
        }

        // A sessão antiga foi encerrada no servidor: limpa também aqui
        localStorage.removeItem("token");
        localStorage.removeItem("usuario");
        alert(dados.mensagem);
        window.location.href = "login.html";
    } catch (erro) {
        console.error(erro);
        alert("Não foi possível conectar ao servidor. Verifique se o backend está rodando.");
    } finally {
        botao.disabled = false;
        botao.textContent = textoOriginal;
    }
    return false;
}
</script>
