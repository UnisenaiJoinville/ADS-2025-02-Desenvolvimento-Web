<body class="body-pag">

                <a href="loja.html" aria-label="Ver carrinho / loja"><i class="bi bi-bag"></i></a>

        <div class="menu text-center mt-3">
            <a href="index.html">Início</a>

</div>


        <section class="criaconta">
       <div class="criaconta_container">
        
        <h2>Cadastre-se</h2>

        <p>
            Crie sua conta, para conseguir realizar compras no site, e ter beneficios.
        </p>
            
            <form name="frmcriaconta" onsubmit="validaCadastro(event)">

                <label for="cc-nome" class="sr-only">Nome completo</label>
                <input type="text" id="cc-nome" placeholder="Nome completo" required>

                <label for="cc-email" class="sr-only">E-mail</label>
                <input type="email" id="cc-email" placeholder="E-mail" required>

                <label for="cc-telefone" class="sr-only">Telefone</label>
                <input type="tel" id="cc-telefone" placeholder="Telefone" required>

                <label for="cc-senha" class="sr-only">Senha</label>
                <input type="password" id="cc-senha" placeholder="Senha (mínimo 6 caracteres)" minlength="6" required>

                <label for="cc-confirma-senha" class="sr-only">Confirmar senha</label>
                <input type="password" id="cc-confirma-senha" placeholder="Confirmar senha" minlength="6" required>

                <button class="btn-criaconta" type="submit">Criar Conta</button>

            </form>
    </div>
    </section>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=3"></script>

<script>
async function validaCadastro(event) {
    event.preventDefault();

    const nome = document.getElementById("cc-nome").value;
    const email = document.getElementById("cc-email").value;
    const telefone = document.getElementById("cc-telefone").value;
    const senha = document.getElementById("cc-senha").value;
    const confirmaSenha = document.getElementById("cc-confirma-senha").value;

    if (senha !== confirmaSenha) {
        alert("As senhas não coincidem. Verifique e tente novamente.");
        document.getElementById("cc-confirma-senha").focus();
        return false;
    }

    const botao = document.querySelector(".btn-criaconta");
    const textoOriginal = botao.textContent;
    botao.disabled = true;
    botao.textContent = "Criando conta...";

    try {
        const resposta = await fetch(`${API_URL}/auth/cadastro.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nome, email, telefone, senha })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            alert(dados.erro || "Não foi possível criar a conta.");
            return false;
        }

        alert("Conta criada com sucesso! Agora você já pode fazer login.");
        window.location.href = "login.html";
    } catch (erro) {
        console.error(erro);
        alert("Não foi possível conectar ao servidor. Verifique se o backend está rodando e tente novamente.");
    } finally {
        botao.disabled = false;
        botao.textContent = textoOriginal;
    }

    return false;
}
</script>

</body>
