<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Petisqueira Chicão</title>



<!-- Bootstrap 4.6 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="css/estilo.css">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">




</head>

<body class="body-pag">


<div class="topo-pag">

    <div class="container-pag">

        <div class="topo-conteudo">

            <div class="logo-pag">
                Petisqueira Chicão
            </div>

            <div class="icones-topo">
                <a href="login.html" id="link-conta">
                    <i class="bi bi-person"></i>
                </a>

                <a href="loja.html" aria-label="Ver carrinho / loja"><i class="bi bi-bag"></i></a>
            </div>

        </div>

        <div class="menu text-center mt-3">
            <a href="index.html">Início</a>
            <a href="loja.html">Produtos</a>
            <a href="contato.html">Contato</a>
        </div>

    </div>

</div>

<div class="container-login">
    <div class="login-box">

        <small>Início • Minha Conta • Login</small>

        <h3 class="mt-3 mb-4">Iniciar sessão</h3>

        <form id="frmLogin" onsubmit="return fazerLogin(event)">
            <div class="form-group">
                <label for="login-email">E-mail</label>
                <input type="email" class="form-control" id="login-email" placeholder="ex.: seuemail@email.com.br" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="senha" placeholder="ex.: suasenha" required>
                    <div class="input-group-append">
                        <span class="input-group-text" onclick="toggleSenha()" style="cursor:pointer;">
                            <i class="bi bi-eye"></i>
                        </span>
                    </div>
                </div>
            </div>

            <div class="text-right mb-3">
                <a href="#" style="font-size:14px;">Esqueceu a senha?</a>
            </div>

            <button class="login-botton" type="submit">Iniciar sessão</button>

            <div class="text-center mt-3" style="font-size:14px;">
                Não possui uma conta ainda?
                <a href="criarconta.html">Criar uma conta</a>
            </div>
        </form>

    </div>
</div>


<footer class="footer">
  <div class="footer-content">

    <div class="social">
      <a href="#"><i class="bi bi-instagram"></i></a>
      <a href="#"><i class="bi bi-facebook"></i></a>
    </div>

    <ul class="footer-menu">
      <li><a href="index.html">Início</a></li>
      <li><a href="loja.html">Produtos</a></li>
      <li><a href="contato.html">Contato</a></li>
    </ul>

    <div class="payments">
      <img src="https://img.icons8.com/color/48/visa.png">
      <img src="https://img.icons8.com/color/48/mastercard.png">
      <img src="https://img.icons8.com/color/48/amex.png">
      <img src="https://img.icons8.com/color/48/boleto-bankario.png">
      <img src="https://img.icons8.com/color/48/pix.png">
    </div>

    <div class="credits">
      <p>Copyright Petisqueira Chicão - 2026</p>
    </div>

  </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=3"></script>

<script>
function toggleSenha() {
    const input = document.getElementById("senha");
    input.type = input.type === "password" ? "text" : "password";
}

async function fazerLogin(event) {
    event.preventDefault();

    const email = document.getElementById("login-email").value;
    const senha = document.getElementById("senha").value;

    const botao = document.querySelector(".login-botton");
    const textoOriginal = botao.textContent;
    botao.disabled = true;
    botao.textContent = "Entrando...";

    try {
        const resposta = await fetch(`${API_URL}/auth/login.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, senha })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            alert(dados.erro || "E-mail ou senha inválidos.");
            return false;
        }

        // Guarda o token e os dados do usuário no navegador,
        // pra usar depois em rotas que exigem login (ex: comprar, ver meus pedidos)
        localStorage.setItem("token", dados.token);
        localStorage.setItem("usuario", JSON.stringify(dados.usuario));

        alert("Login realizado com sucesso! Bem-vindo(a) de volta.");
        window.location.href = "index.html";
    } catch (erro) {
        console.error(erro);
        alert("Não foi possível conectar ao servidor. Verifique se o backend está rodando e tente novamente.");
    } finally {
        botao.disabled = false;
        botao.textContent = textoOriginal;
    }

    return false;
}
</script>

</body>
</html>
