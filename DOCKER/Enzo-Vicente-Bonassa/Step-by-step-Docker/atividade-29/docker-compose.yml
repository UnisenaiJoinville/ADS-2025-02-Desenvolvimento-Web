services:
  app:
    image: nginx:alpine
    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - proxy_net
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - proxy_net
networks:
  proxy_net:
