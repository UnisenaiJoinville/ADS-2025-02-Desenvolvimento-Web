name: ads-cenario-3

services:
  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5174:5173"  # 5173 do host ja e usado pelo Cenario 1, que fica rodando
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    networks: [app_net]

  api:
    build: ./backend
    command: npm run dev
    ports:
      - "3001:3000"  # 3000 do host ja e usado pelo Cenario 1, que fica rodando
    env_file: .env
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]

  worker:
    build: ./worker
    command: npm run worker
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [app_net]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    networks: [app_net]

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "15674:15672"  # 15672 do host ja e usado pelo Cenario 1, que fica rodando
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]

networks:
  app_net:

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  backend_node_modules:
