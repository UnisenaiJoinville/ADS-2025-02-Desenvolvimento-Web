name: painel-tarefas
services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks: [internal_net]

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    expose: ["5173"]
    volumes:
      - ./frontend:/app
      - tasks_front_modules:/app/node_modules
    networks: [internal_net]

  api:
    build: ./backend
    command: npm run dev
    env_file: .env
    expose: ["3000"]
    volumes:
      - ./backend:/app
      - tasks_api_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [internal_net]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tasks_pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal_net]

  redis:
    image: redis:7.4-alpine
    networks: [internal_net]

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "15674:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal_net]

  pgadmin:
    image: dpage/pgadmin4:8
    profiles: ["tools"]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: docker@local.dev
      PGADMIN_DEFAULT_PASSWORD: docker123
    networks: [internal_net]

networks:
  internal_net:
volumes:
  tasks_pg_data:
  tasks_front_modules:
  tasks_api_modules:
