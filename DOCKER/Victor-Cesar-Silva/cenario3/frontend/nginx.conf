server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # "backend" e o nome do servico no compose - resolvido pelo DNS do Docker.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
    }
}
