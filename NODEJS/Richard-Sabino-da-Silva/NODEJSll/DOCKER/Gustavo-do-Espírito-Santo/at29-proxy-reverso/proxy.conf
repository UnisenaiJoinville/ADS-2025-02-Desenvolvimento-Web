# Atividade 29 - configuracao do proxy reverso (Nginx)
# Recebe as requisicoes na porta 80 do container "proxy" e as encaminha
# para o servico "app" (resolvido pelo DNS interno da rede Docker).
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass         http://app:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         X-Proxied-By      "nginx-reverse-proxy (Atividade 29)";
    }
}
